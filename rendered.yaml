# Source: ajio-clone/templates/service-backend.yaml
apiVersion: v1
kind: Service
metadata:
  name: test-ajio-clone-backend
  labels:
        
    app.kubernetes.io/name: test-ajio-clone
    app.kubernetes.io/instance: test
    app.kubernetes.io/version: 1.0.0
    app.kubernetes.io/managed-by: Helm
spec:
  type: NodePort
  selector:
    app: test-ajio-clone-backend
  ports:
    - port: 5000
      targetPort: 5000
      protocol: TCP
      nodePort: 30050

---
# Source: ajio-clone/templates/service-frontend.yaml
