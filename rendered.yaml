kind: Service
metadata:
  name: test-ajio-clone-frontend
  labels:
        
    app.kubernetes.io/name: test-ajio-clone
    app.kubernetes.io/instance: test
    app.kubernetes.io/version: 1.0.0
    app.kubernetes.io/managed-by: Helm
spec:
  type: NodePort
  selector:
    app: test-ajio-clone-frontend
  ports:
    - port: 4173
      targetPort: 4173
      protocol: TCP
      nodePort: 30080

---
# Source: ajio-clone/templates/deployment-backend.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-ajio-clone-backend
  labels:
    
    app.kubernetes.io/name: test-ajio-clone
    app.kubernetes.io/instance: test
    app.kubernetes.io/version: 1.0.0
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 2
  selector:
    matchLabels:
      app: test-ajio-clone-backend
  template:
    metadata:
      labels:
        app: test-ajio-clone-backend
      annotations:
        {}
    spec:

      containers:
        - name: backend
          image: "ajio:1.0.0.0"
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 5000

